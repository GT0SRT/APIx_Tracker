name: APIx SARIMAX ML Forecast & Retraining Pipeline

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual on-demand trigger from GitHub Actions tab

jobs:
  retrain-sarimax-model:
    name: Retrain SARIMAX CPI Forecaster & Update Projections
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/ml/requirements.txt

      - name: Run SARIMAX Training & 6-Month Forecasting
        run: |
          python backend/ml/cpi_forecaster.py --save-output backend/ml/data/forecasts_latest.json

      - name: Notify / Trigger Backend Production Database Update
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'https://apix-tracker.onrender.com' }}
          ADMIN_JWT: ${{ secrets.ADMIN_JWT }}
        run: |
          echo "Triggering APIx production backend forecast refresh..."
          curl -s -X POST "${BACKEND_API_URL}/api/v1/forecast/train" \
            -H "Content-Type: application/json" \
            ${ADMIN_JWT:+-H "Authorization: Bearer $ADMIN_JWT"} || echo "Backend ping completed"
